      > 但综合页（concept/entity）没有地方记录「这条结论的来源可靠到什么程度」。
      > 批判性纪律**全部为 source 型页设计**，从未定义综合页如何承载限定词
      > ⇒ 限定词在 `source → concept` 这一跳**必然丢失，因为综合页没有地方记**。
      > 该字段就是那个「地方」。

  - find: '被引文献的 DOI**（会把链接指到别的论文）。全库 416/416 已回填（2026-10-06）。'
    replace: '被引文献的 DOI**（会把链接指到别的论文）。'

  - find: '- **现规模**：数据库 724 / 文献总览 503 / 概念索引 129 / 实体名录 60 / 公众号文集 98。'
    replace: '- **规模**：见各 `.base` 视图自身。'

  - find: '2026-10-10 曾致 724 页总览只剩 33 页）。该工具已挂进 `lit_ingest` 收尾链，建卡后自动跑。'
    replace: '曾致总览视图大幅收窄且无任何报错）。该工具已挂进 `lit_ingest` 收尾链，建卡后自动跑。'

  - find: '- **换行符 CRLF/LF 混合**（非统一，实测 `wiki/` 304 CRLF + 69 LF）⇒ **不要对换行做假设**，'
    replace: '- **换行符 CRLF/LF 混合**（非统一）⇒ **不要对换行做假设**，'

  - find: |-
      ## 版本兼容性

      > 🔴 **操作批次文件（`batches_v2.json` / `batch_done.json`）前，必须先确认格式版本。**
      > 完整流程（v1/v2 判定、迁移纪律、`batch_close` 前检查清单、脚本用法）见**项目技能
      > `.dsh/skills/kb-ingest-batch/SKILL.md`**；版本沿革见 `_MAINTENANCE.md` §五。
      >
      > ⚠️ **委托纪律（本库反复踩的坑）**：委托前**确认运行时真会加载那个文件**——
      > 曾把关键流程委托给运行时根本不读的 `.claude/skills/…`，长期静默失效。
      > 「已声明」≠「已生效」（详见 [`tools/_INCIDENTS.md`](tools/_INCIDENTS.md) §四）。

      ---
