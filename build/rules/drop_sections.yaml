# CLAUDE.md 的 section-aware 变换：块级替换 + 计数清除。
# 每条 {find, replace}：find 必须能在源 CLAUDE.md 中逐字命中（否则构建告警 = 真源已漂移）。
# 通用方法论**逐字保留**，只删/改库专属事实（计数、更名史、迁移记录、指向未随包文档的指针）。
# 指向 _MAINTENANCE.md / _INCIDENTS.md 的指针另由 build_kit 的正则归一化处理。
rules:
  - find: '# CLAUDE.md — Matsci Knowledge Base Schema'
    replace: '# CLAUDE.md — 知识库 Schema'

  - find: |-
      > 本文件是 **Matsci Knowledge Base**（原名 Battery Knowledge Base / 电池知识库）的配置中枢。
      > 它告诉 Agent 如何结构化知识库、遵守什么约定、以及执行 ingest/query/lint 三大工作流。
      > 此文件由用户和 Claude 共同演化。
      >
      > **库名沿革**：2026-10-04 由「Battery Knowledge Base」更名为「Matsci Knowledge Base」——
      > 收录范围已从锂电池扩展到材料科学全域（电池 / 催化 / 能源材料 / 机器学习势 / 自驱动实验室等）。
      > Windows 目录路径的改名另行执行，见 §已知陷阱 与迁移记录。
    replace: |-
      > 本文件是本知识库的配置中枢：定义页面结构、约定，以及 ingest/query/lint 三大工作流。
      > 由 matsci-kb-kit 提供，随你的库一起演化。

  - find: |-
      ## 🔴 项目技能索引（按需加载）

      本库的工作流细节已抽出为**项目技能**。本文件常驻上下文且预算已近满，
      技能只在触发时进入上下文 ⇒ **做对应工作前先加载对应技能，不要凭本文件的摘要硬做。**

      `lit-pipeline` 文献流水线本地约定 ｜ `lit-watch` 文献发现→下载→建卡全链 ｜ `kb-query` 库内检索与作答 ｜
      `kb-lint` 健康检查与补链 ｜ `kb-qc-loop` QC 核查循环 ｜ `kb-review-cycle` 审稿—修改循环 ｜ `kb-ingest-batch` 批次 ingest

      🔴 **技能真源在 `.dsh/skills/`**（`.claude/skills/` 下 7 个均为 junction，**改内容改 `.dsh/` 那份**）。
      技能仅在**项目根**被发现；若 `/` 菜单看不到，确认会话从本库目录启动。
      （双运行时细节见 [`tools/_MAINTENANCE.md`](tools/_MAINTENANCE.md) §一。）
    replace: |-
      ## 🔴 项目技能索引（按需加载）

      本工具链的工作流细节已抽出为**项目技能**。本文件常驻上下文，技能只在触发时进入上下文
      ⇒ **做对应工作前先加载对应技能，不要凭本文件的摘要硬做。**

      `lit-pipeline` 文献流水线本地约定 ｜ `lit-watch` 文献发现→下载→建卡全链 ｜
      `kb-query` 库内检索与作答 ｜ `kb-lint` 健康检查与补链

      🔴 **技能真源在 `.dsh/skills/`**；技能仅在**项目根**被发现。

  - find: |-
      ## 目录结构

      **顶层只有 5 个目录**（2026-10-04 结构精简：14 目录 / 51 游离文件 → 5 目录 / 0 游离文件）：

      | 目录 | 层 | 说明 |
      |---|---|---|
      | `wiki/` | 知识层 | **724 页**：`concepts/`(129) `entities/`(60) `sources/`(503) `topics/`(7) `outputs/`(25) ＋ 根下**元文件** `index.md` `tags.md` `log*.md` ＋ `.index/`（派生数据，可重建） |
      | `raw/` | 资料层 | `pdf/`（**530 个 PDF＝`raw/` 全树计数**；其中 `raw/pdf/` 内 495）`text/`(全文提取 md) `clippings/`(剪藏) `assets/`(正文图) `notes/`(批次笔记与 lit-watch 运行产物) |
      | `tools/` | 工具层 | `kb_*.py` 检索层 ｜ `qc_*.py` 质检层 ｜ `lit_*.py` **文献获取层** |
      | `projects/` | 工程层 | `AI-for-Materials-Review/`（综述稿工程，与知识层分离） |
      | `_archive/` | 归档层 | **只移不删**；登记册见 `_archive/README.md`。**5 组**：`restructure/`(结构迁移记录与备份) `lit-watch/`(文献流水线历史) `qc/`(QC 工作区归档) `retired/`(退役工具/技能/脚本/规范 + 隔离区 `quarantine/`) `scratchpad/`(临时件) |

      > 🔴 **2026-10-11 结构变更（本轮）**：`raw/_park` **已解散**（290 个文件）。
      > 隔离件（跑题/重复/遗留图片 + 历史目录元数据）→ `_archive/retired/quarantine/`；
      > 被取代的 `catalogue/`(去重目录旧版) 与 `downloads/`(历史手动下载清单) 也进该隔离区。
      > 代码侧随之改：`kb_dois.LEGACY_CATALOGUE_RELPATHS`、`lit_manual_import` 的历史清单目录、
      > `kb_lib.QC_ARCHIVE`、`lit_doctor.LEGACY_RUNS`。`_archive` 由 13 个子目录归并为上述 5 组。
      > 新笔记落点也从 `raw/_park` 改为 `raw/notes`（`.obsidian/app.json`）。

      ⚠️ 根下 `*.base` 是 Obsidian 核心插件 Bases，**不是** Dataview（两者语法不同，勿混）。

      > **改名**：本库 2026-10-04 由「Battery Knowledge Base」更名为「Matsci Knowledge Base」。
      > Windows 目录改名由 `tools/migrate-folder.ps1` 执行（干跑默认）。
      > **工具链已全部改用 `__file__` 派生库根，改名后不需要改任何脚本**。

      > 另见 §版本兼容性 了解 `batches_v2.json` / `batch_done.json` 等批次文件格式。
    replace: |-
