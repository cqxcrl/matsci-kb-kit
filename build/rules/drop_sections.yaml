  - find: |-
      > 🔴 **为什么加 `evidence_base`**：QC 实测 `source_reliability` 在 source 页是
      > **362/362**，在 concept 页只有 **8/117**。CLAUDE.md 的批判性纪律**全部为 source 型页
      > 设计**，从未定义综合页如何承载「这条结论的来源可靠到什么程度」
      > ⇒ 限定词在 `source → concept` 这一跳**必然丢失，因为综合页没有地方记**。
      > 该字段就是那个「地方」。
    replace: |-
