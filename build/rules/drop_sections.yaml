      | `raw/` | 资料层 | `pdf/` `text/`(全文提取 md) `clippings/`(剪藏) `assets/`(正文图) `notes/`(运行产物) |
      | `tools/` | 工具层 | `kb_*.py` 检索层 ｜ `lit_*.py` **文献获取层** |
      | `projects/` | 工程层 | 可选：与知识层分离的写作/工程 |
      | `_archive/` | 归档层 | **只移不删** |

