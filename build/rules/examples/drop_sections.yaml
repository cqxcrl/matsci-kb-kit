# 示例：CLAUDE.md / docs/TOOLS.md 的**块级删除**表。
# 复制成 private/drop_sections.yaml 后填你自己的规则。
#
# 三个键，对应三种粒度：
#   rules         —— 字面量 find/replace，成段改写。未命中会告警（漂移可见）。
#   drop_headings —— 按 Markdown 标题删到下一个同级或更高级标题，可选插入替代文本。
#   drop_lines    —— 按正则逐行删（作用于 docs/TOOLS.md 的真源，即源库 tools/_README.md）。
#
# 🔴 这三类规则里必然出现源库专名（否则无从定位要删的段落），所以整份归 private/。
#
# 🔴 选哪种粒度，看目标是**死文本**还是**活台账**：
#    · 死文本（署名、致谢、外链声明）——用 rules，字面量最精确；
#    · 活台账（每轮诊断都在改的欠账清单、边界登记）——**必须**用 drop_headings。
#      字面量规则会天天漂移告警，告警一多就被无视，那比没有规则更糟。
#    · 一句话噪声（更名史）——用 drop_lines，整行删掉比替换干净。

# ───────────────────────── 1. 字面量成段改写 ─────────────────────────
rules:
  # 署名/致谢里的个人身份 → 中性说法
  - find: '_本库由 张三 与 Agent 共同维护，联系方式见 _MAINTENANCE.md。_'
    replace: '_本工具链由用户与 Agent 共同演化。_'

  # 指向未随包发布的库内文档 → 换成 kit 内的等价物
  - find: '详见 `_INCIDENTS.md` 的事故记录。'
    replace: '（源库另有一份事故记录，不随包发布。）'

  # 整段私有状态 → 可复用的方法论
  - find: |-
    当前欠账：重复卡 12 张、tag 变体 7 组、si_status 待核 34 篇。
  - replace: |-
    欠账计数一律以命令输出为准，不要抄旧数——它们随每日 ingest 失效。

# ─────────────────── 2. 按标题整段删除（活台账用这个） ───────────────────
# replace 省略 = 整段删净不留痕；给了就替换成你的版本。
drop_headings:
  - heading: '## 🔎 第 N 轮核验（2026-01-01）'
    replace: |-
      ## 🔎 已知边界台账（建议你自己维护一份）

      源库在每轮诊断后都会留下这样一节，**只登记「核验后仍然存在、且本轮不打算处理」的边界**，
      免得下一轮把它们当新发现重查一遍。随包发布的这一份已把源库的私有状态摘掉，
      只留下方法——请在你自己的库里建一份同结构的：

      - **每条边界写清「为什么不处理」**：收益低于误伤风险、受某条纪律约束、需专门一轮……
        没有理由的边界等于没登记，下一轮照样会被翻出来重查。
      - **数字一律现场重算，不抄旧结论**：台账里的计数会随每日 ingest 失效。
        写「以命令输出为准，勿引用旧数」，比写一个必然过期的数字诚实。
      - **不要把状态字段改好看**：例如把 `missing` 改成 `present` 充数——
        改字段不改事实只是把欠账藏起来。
      - **典型条目类型**：重复卡未归档、tag 变体并存、字段语义漂移、统计口径分裂。

      ---

# ───────────────────────── 3. 按正则逐行删 ─────────────────────────
drop_lines:
  # 更名史：源库记过自己叫什么、哪年改的名——对 kit 用户毫无意义，还白送旧库名
  - pattern: |-
      ^.*(?:我的知识库名|我的旧库名|原名).*$
