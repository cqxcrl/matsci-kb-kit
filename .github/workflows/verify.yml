name: verify-kit

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: pip install -r requirements.txt
      - name: Verify kit (leak scan + compile + --help + empty-vault smoke)
        run: python scripts/verify_kit.py
