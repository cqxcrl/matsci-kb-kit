name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: pip install -r requirements.txt
      - name: Verify plugin (leak scan + compile + --help + smoke + MCP + whitelist)
        run: python scripts/verify_plugin.py
      - name: Unit tests
        run: python -m unittest discover -s tests